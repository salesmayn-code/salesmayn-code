<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120" />
      <stop offset="0.48" stop-color="#172554" />
      <stop offset="1" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="0" x2="990" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#38BDF8;#A78BFA" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.55" />
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#93C5FD" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1200" height="310" rx="26" fill="url(#background)" />
  <rect width="1200" height="310" rx="26" fill="url(#grid)" />
  <circle cx="1060" cy="30" r="210" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="95" cy="300" r="185" fill="url(#glow)" opacity="0.55" />

  <g opacity="0.7">
    <circle cx="71" cy="64" r="5" fill="#38BDF8">
      <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1112" cy="226" r="5" fill="#A78BFA">
      <animate attributeName="r" values="5;8;5" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <path d="M70 64C180 20 215 104 319 63" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M878 253C987 187 1045 280 1112 226" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" values="0;72" dur="5s" repeatCount="indefinite" />
    </path>
  </g>

  <g filter="url(#shadow)">
    <rect x="185" y="48" width="830" height="214" rx="24" fill="#0F172A" fill-opacity="0.76" stroke="url(#accent)" stroke-width="1.5" />
    <rect x="220" y="80" width="110" height="28" rx="14" fill="#1D4ED8" fill-opacity="0.28" stroke="#38BDF8" stroke-opacity="0.5" />
    <circle cx="240" cy="94" r="5" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="253" y="100" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OPEN TO WORK</text>

    <text x="600" y="155" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="0.8">MUHAMMAD SALEH JANJUA</text>
    <rect x="300" y="174" width="600" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="160;600;160" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="520;300;520" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="600" y="211" text-anchor="middle" fill="#C4B5FD" font-family="JetBrains Mono,Consolas,monospace" font-size="20" font-weight="600">FULL-STACK DEVELOPER  ·  DEVOPS  ·  DEVSECOPS</text>
    <text x="600" y="239" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="0.8">BUILDING SECURE, TESTABLE, PRODUCTION-MINDED SOFTWARE</text>
  </g>
</svg>
